<div class="flex h-screen bg-slate-50 dark:bg-slate-950 overflow-hidden font-sans text-slate-800 dark:text-slate-100 transition-colors duration-200">
      
      <!-- Mobile Backdrop using @if -->
      @if (isMobileOpen()) {
        <div 
          (click)="isMobileOpen.set(false)" 
          class="fixed inset-0 bg-slate-900/60 backdrop-blur-2xs z-40 lg:hidden transition-opacity">
        </div>
      }

      <app-sidebar 
        [isCollapsed]="isCollapsed()" 
        [isMobileOpen]="isMobileOpen()"
        (closeMobile)="isMobileOpen.set(false)">
      </app-sidebar>

      <div 
        class="flex-1 flex flex-col min-w-0 overflow-hidden transition-all duration-300"
        [ngClass]="{'lg:ml-64': !isCollapsed(), 'lg:ml-20': isCollapsed()}">
        
        <!-- Top Header Layout -->
        <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 sm:px-6 lg:px-8 shrink-0 transition-colors duration-200">
          
          <!-- Mobile Hamburger / Desktop Collapse Toggles -->
          <div class="flex items-center gap-3">
            <button (click)="isMobileOpen.set(true)" 
              class="lg:hidden p-2 -ml-2 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
              aria-label="Open mobile menu">
              <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
            </button>
            <button (click)="isCollapsed.set(!isCollapsed())" 
              class="hidden lg:block p-2 -ml-2 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
              title="Toggle sidebar">
              <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16"/>
              </svg>
            </button>
          </div>

          <!-- Actions Section: Theme Switcher + User Info + Logout -->
          <div class="flex items-center gap-2.5 sm:gap-4">
            
            <!-- Sleek Theme Switcher Button -->
            <button 
              (click)="themeService.toggleTheme()" 
              type="button"
              class="flex items-center gap-2 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-slate-800/80 text-slate-600 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 hover:border-slate-300 dark:hover:border-slate-600 transition-all cursor-pointer shadow-2xs group"
              [title]="themeService.isDark() ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
              aria-label="Toggle Theme">
              @if (themeService.isDark()) {
                <svg class="w-4 h-4 text-amber-400 group-hover:rotate-45 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="4"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m14.14-14.14l-1.41 1.41" />
                </svg>
                <span class="text-xs font-bold text-slate-200 hidden sm:inline">Light</span>
              } @else {
                <svg class="w-4 h-4 text-indigo-500 group-hover:-rotate-12 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <span class="text-xs font-bold text-slate-700 hidden sm:inline">Dark</span>
              }
            </button>

            <!-- User Info Badge -->
            <div class="flex items-center gap-2.5 sm:gap-3 pl-2 sm:pl-3 border-l border-slate-200 dark:border-slate-800">
              <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                {{ getUserInitials() }}
              </div>
              <div class="hidden sm:flex flex-col text-left">
                <span class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-tight">{{ username() }}</span>
                <span class="text-[10px] font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-wide">{{ userRole() }}</span>
              </div>
            </div>

            <!-- Logout Action Button -->
            <button (click)="logout()" 
              class="flex items-center gap-1.5 sm:gap-2 px-2.5 sm:px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-950/40 hover:text-rose-600 dark:hover:text-rose-400 hover:border-rose-200 dark:hover:border-rose-800/60 transition-all text-xs font-medium cursor-pointer"
              title="Logout">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              <span class="hidden md:inline">Logout</span>
            </button>

          </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-50 dark:bg-slate-950 transition-colors duration-200">
          <router-outlet></router-outlet>
        </main>

      </div>
    </div>
