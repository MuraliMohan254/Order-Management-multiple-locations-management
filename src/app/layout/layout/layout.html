<div class="flex h-screen bg-slate-50 overflow-hidden font-sans text-slate-800">
      
      <!-- Mobile Backdrop using @if -->
      @if (isMobileOpen()) {
        <div 
          (click)="isMobileOpen.set(false)" 
          class="fixed inset-0 bg-slate-900/50 z-40 lg:hidden transition-opacity">
        </div>
      }

      <app-sidebar 
        [isCollapsed]="isCollapsed()" 
        [isMobileOpen]="isMobileOpen()"
        (closeMobile)="isMobileOpen.set(false)">
      </app-sidebar>

      <div 
        class="flex-1 flex flex-col min-w-0 overflow-hidden transition-all duration-300"
        [ngClass]="{'lg:ml-64': !isCollapsed(), 'lg:ml-20': isCollapsed()}">
        
        <!-- Top Header Layout (`layout.component.ts`) -->
<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 lg:px-8 shrink-0">
  
  <!-- Mobile Hamburger / Desktop Collapse Toggles -->
  <div class="flex items-center gap-4">
    <button (click)="isMobileOpen.set(true)" class="lg:hidden p-2 -ml-2 text-slate-500 hover:text-slate-700 rounded-md">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <button (click)="isCollapsed.set(!isCollapsed())" class="hidden lg:block p-2 -ml-2 text-slate-500 hover:text-slate-700 rounded-md">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16"/>
      </svg>
    </button>
  </div>

  <!-- User Profile & Logout Section in Header Navbar -->
  <div class="flex items-center gap-4">
    
    <!-- User Info Badge -->
    <div class="flex items-center gap-3 pl-3 border-l border-slate-200">
      <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">
        {{ getUserInitials() }}
      </div>
      <div class="hidden sm:flex flex-col text-left">
        <span class="text-xs font-bold text-slate-800 leading-tight">{{ username() }}</span>
        <span class="text-[10px] font-semibold text-blue-600 uppercase tracking-wide">{{ userRole() }}</span>
      </div>
    </div>

    <!-- Logout Action Button -->
    <button (click)="logout()" 
      class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-all text-xs font-medium cursor-pointer"
      title="Logout">
      <!-- Lucide Log Out Icon -->
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span class="hidden md:inline">Logout</span>
    </button>

  </div>
</header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
          <router-outlet></router-outlet>
        </main>

      </div>
    </div>
