<aside 
      class="fixed inset-y-0 left-0 bg-slate-900 text-slate-300 transition-all duration-300 ease-in-out flex flex-col z-50"
      [ngClass]="{
        'w-64 translate-x-0': !isCollapsed && isMobileOpen,
        '-translate-x-full lg:translate-x-0': !isMobileOpen,
        'w-64': !isCollapsed,
        'w-20': isCollapsed
      }">
      
      <!-- Logo Area using @if / @else -->
      <div class="h-16 flex items-center justify-center border-b border-slate-800 shrink-0 px-4">
        @if (!isCollapsed || isMobileOpen) {
          <span class="text-white font-bold text-xl truncate">
            {{ sharedService.appName }}
          </span>
        } @else {
          <span class="text-white font-bold text-xl">
            OM
          </span>
        }
      </div>

      <!-- Navigation Links using @for -->
      <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-2.5">
        @for (item of menuItems; track item.route) {
          <a [routerLink]="item.route"
             routerLinkActive="!bg-blue-600 !text-white shadow-md shadow-blue-900/30 font-bold"
             [routerLinkActiveOptions]="{ exact: false }"
             class="flex items-center px-3 py-2.5 rounded-xl hover:bg-slate-800/90 text-slate-300 hover:text-white transition-all cursor-pointer group"
             [ngClass]="{'justify-center': isCollapsed && !isMobileOpen}">
            
            <svg class="w-5 h-5 shrink-0 text-slate-400 group-hover:text-blue-300 group-[.router-link-active]:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
            </svg>

            @if (!isCollapsed || isMobileOpen) {
              <span class="ml-3 font-medium text-xs truncate">
                {{ item.label }}
              </span>
            }
          </a>
        }
      </nav>
    </aside>
