services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: om_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-order_management}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Inventory$murali@2025}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-order_management}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - om_net

  # ==========================================
  # 2. Spring Boot 3 Backend API Service
  # ==========================================
  backend:
    build:
      context: ./backend/order-management
      dockerfile: Dockerfile
    container_name: om_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-order_management}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Inventory$murali@2025}
      JWT_SECRET: ${JWT_SECRET:-yAhmxRTWRPeFvmZhr2hcd6om8rOm+5n3REZgiKt4EJY=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,https://localhost,https://127.0.0.1}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-50}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-15}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - om_net

  # ==========================================
  # 3. Angular Frontend & Nginx Gateway
  # ==========================================
  frontend:
    build:
      context: ./frontend/order-management
      dockerfile: Dockerfile
    container_name: om_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - om_net

volumes:
  postgres_data:
    name: om_postgres_data

networks:
  om_net:
    name: om_network
    driver: bridge
